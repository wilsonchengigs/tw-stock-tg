name: 台股日報
on:
  schedule:
    # GitHub 用 UTC；週一到週五台灣 21:30 一次寄全部（融資資料約 21:00 才公布）。
    # 排程可能延遲幾分鐘到半小時，資料還沒出來時程式會自己等
    - cron: '30 13 * * 1-5'
  workflow_dispatch:
    inputs:
      part:
        description: 'close＝大盤＋三大法人、margin＝融資維持率、all＝全部'
        required: false
        default: 'all'
      date:
        description: '指定日期 YYYYMMDD（留空＝今天）'
        required: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python report.py
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          REPORT_PART: ${{ inputs.part || 'all' }}
          REPORT_DATE: ${{ inputs.date }}
