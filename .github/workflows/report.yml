name: 台股日報
on:
  schedule:
    # GitHub 用 UTC；週一到週五台灣 21:30 一次寄全部（融資資料約 21:00 才公布）。
    # 排程可能延遲幾分鐘到半小時，資料還沒出來時程式會自己等
    - cron: '30 13 * * 1-5'
    # 備援：GitHub 排程會延遲甚至整次漏掉（11/24 21:30 那次延到隔天 07:11 才跑）。22:40、00:40 各再跑一次，
    # 已經送過就不重送（data/sent_dates.csv）；隔天中午前才跑到的改送前一個平日
    - cron: '40 14 * * 1-5'
    - cron: '40 16 * * 1-5'
    # 台灣 14:40 收盤後提醒（REPORT_PART=alert）：只有「爆量收黑」觸發才送，讓台指期能趕 15:00 夜盤開盤
    - cron: '40 6 * * 1-5'
  workflow_dispatch:
    inputs:
      part:
        description: 'close＝大盤＋三大法人、margin＝融資維持率、all＝全部、alert＝收盤後爆量收黑提醒（沒觸發不送）'
        required: false
        default: 'all'
      date:
        description: '指定日期 YYYYMMDD（留空＝今天）'
        required: false

# 排隊依序跑：後一次 checkout 時才拿得到前一次 commit 的 sent_dates.csv，不會兩次同時送
concurrency:
  group: report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 把新抓的資料（小時 K、日收盤、融資、P/C）存回 data/，下次只抓新的
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python report.py
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          REPORT_PART: ${{ inputs.part || (github.event.schedule == '40 6 * * 1-5' && 'alert' || 'all') }}
          REPORT_DATE: ${{ inputs.date }}

      # data/ 有新增才 commit；過去的資料不會變，下次只抓當天／當月
      - name: 存回資料快取
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.csv
          git diff --cached --quiet || (git commit -m "資料快取更新" && git push)
